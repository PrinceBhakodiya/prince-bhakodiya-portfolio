# Installed by deploy.sh from deploy/nginx/ in the portfolio repo. Edit it there, not here.
include /www/server/panel/vhost/nginx/extension/princebhakodiya.in/security-headers.inc;

# Older apps on this domain stay reachable but are kept out of search results
set $robots_tag "";
if ($uri ~ "^/(pocketse|spider-tracker)(/|$)") { set $robots_tag "noindex, nofollow"; }
add_header X-Robots-Tag $robots_tag always;

# /index.html and /about/index.html would duplicate the clean URLs.
# $request_uri is the original request, so nginx's own internal index lookup is unaffected.
if ($request_uri ~ "^([^?]*/)index\.html(\?.*)?$") { return 301 $1$2; }

# Next.js build assets have content hashes in their names, so they can be cached for a year
location ^~ /_next/static/ {
    include /www/server/panel/vhost/nginx/extension/princebhakodiya.in/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

# Images and fonts (the panel's own rule misses .webp, .svg and .woff2)
location ~* \.(?:webp|avif|png|jpe?g|gif|svg|ico|woff2)$ {
    include /www/server/panel/vhost/nginx/extension/princebhakodiya.in/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    access_log off;
}
